name: Deploy storefront to GitHub Pages

# Builds the static storefront. The API is deployed separately to Neon Functions
# with `neon deploy` (see docs/NEON.md). The API URL below is public; set the
# repository variable NEXT_PUBLIC_API_URL to point the site somewhere else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build static export
        run: npm run build:static
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://br-soft-mode-az0zpm32-api.compute.c-3.ap-southeast-1.aws.neon.tech' }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
