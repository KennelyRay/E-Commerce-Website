<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4CFF"/>
      <stop offset="1" stop-color="#3518D8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect id="background" width="1600" height="1200" fill="#08090B"/>

  <!-- ================= ICON ================= -->
  <g id="icon" filter="url(#shadow)">
    <!-- top of PC cube -->
    <polygon id="cube-top" points="500,180 800,90 1100,245 795,345" fill="#101116" stroke="#F7F7F8" stroke-width="18" stroke-linejoin="round"/>
    <!-- left/front face -->
    <polygon id="cube-front" points="500,180 795,345 795,690 500,525" fill="#0C0D10" stroke="#F7F7F8" stroke-width="18" stroke-linejoin="round"/>
    <!-- right face -->
    <polygon id="cube-side" points="795,345 1100,245 1100,590 795,690" fill="#171227" stroke="#5B3DFF" stroke-width="18" stroke-linejoin="round"/>

    <!-- top vents -->
    <g id="vents" fill="#F7F7F8">
      <polygon points="640,178 695,162 760,197 705,215"/>
      <polygon points="700,158 755,142 820,177 765,195"/>
      <polygon points="760,138 815,122 880,157 825,175"/>
      <polygon points="820,118 875,102 940,137 885,155"/>
    </g>

    <!-- V mark -->
    <path id="V-mark" d="M550 265 L630 309 L708 352 L650 385 L592 353 L550 329 Z M592 353 L650 385 L706 505 L650 539 L592 419 L550 395 Z" fill="#F7F7F8" fill-rule="evenodd"/>

    <!-- H mark -->
    <path id="H-mark" d="M730 360 L805 384 L805 470 L875 446 L875 390 L950 366 L950 585 L875 609 L875 523 L805 547 L805 633 L730 609 Z" fill="url(#purple)"/>

    <!-- fan housing -->
    <g id="fan" transform="translate(1035 418)">
      <rect x="-80" y="-80" width="160" height="160" rx="12" fill="#241A61" stroke="#6B4CFF" stroke-width="10"/>
      <circle cx="0" cy="0" r="56" fill="#0A0B0E" stroke="#8B78FF" stroke-width="8"/>
      <g fill="#6B4CFF">
        <path d="M0,-8 C-42,-55 -54,-24 -34,4 C-20,22 -4,18 0,-8Z"/>
        <path d="M8,0 C55,-42 24,-54 -4,-34 C-22,-20 -18,-4 8,0Z" transform="rotate(72)"/>
        <path d="M8,0 C55,-42 24,-54 -4,-34 C-22,-20 -18,-4 8,0Z" transform="rotate(144)"/>
        <path d="M8,0 C55,-42 24,-54 -4,-34 C-22,-20 -18,-4 8,0Z" transform="rotate(216)"/>
        <path d="M8,0 C55,-42 24,-54 -4,-34 C-22,-20 -18,-4 8,0Z" transform="rotate(288)"/>
      </g>
      <circle cx="0" cy="0" r="13" fill="#8B78FF"/>
      <circle cx="-62" cy="-62" r="5" fill="#8B78FF"/>
      <circle cx="62" cy="-62" r="5" fill="#8B78FF"/>
      <circle cx="-62" cy="62" r="5" fill="#8B78FF"/>
      <circle cx="62" cy="62" r="5" fill="#8B78FF"/>
    </g>
  </g>

  <!-- ================= WORDMARK ================= -->
  <g id="wordmark" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-style="italic">
    <text x="225" y="865" font-size="190" fill="#F7F7F8" letter-spacing="-8">Vetix</text>
    <text x="820" y="865" font-size="190" fill="url(#purple)" letter-spacing="-8">Hub</text>
  </g>

  <!-- ================= TAGLINE ================= -->
  <g id="tagline" font-family="Arial, Helvetica, sans-serif" font-weight="500" fill="#F7F7F8">
    <text x="405" y="955" font-size="38" letter-spacing="13">PC PARTS</text>
    <circle cx="735" cy="943" r="11" fill="#6B4CFF"/>
    <text x="790" y="955" font-size="38" letter-spacing="10">UPGRADE YOUR SETUP</text>
  </g>

  <!-- Accent -->
  <path id="accent" d="M430 1020 H1170" stroke="#6B4CFF" stroke-width="5" opacity=".65"/>
</svg>
